{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'finance/materials.css' %}">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            font-family: 'Istok Web', sans-serif;
        }

        .sidebar {
            width: 250px;
            background-color: #ffffff;
            color: rgb(17, 17, 17);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            border-right: 1px solid #d3d3d3;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
        }

        .sidebar a {
            color: rgb(17, 17, 17);
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: all 0.3s ease;
            width: 100%;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        .sidebar a:hover {
            background-color: #2d6fa0;
            color: white;
            transform: translateY(-10px);
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }

        .sidebar a.active {
            color: white;
            background-color: #2d6fa0;
            transform: translateY(-10px);
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            border-left: 4px solid #171718;
        }

        .logout {
            margin-top: auto;
            text-align: center;
            width: 100%;
        }

        .logout a {
            width: 100%;
            margin: 0;
            border-radius: 0;
            text-align: center;
            display: block;
            box-sizing: border-box;
            background-color: red;
            color: white;
            padding: 15px 20px;
            transition: background-color 0.3s ease;
        }

        .logout a:hover {
            background-color: #c9302c;
        }

        .content {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="{% static 'logo/logo.png' %}" alt="Logo">
        </div>
        <a href="{% url 'mechanic:joborder_list' %}" 
           class="{% if request.resolver_match.url_name == 'joborder_list' %}active{% endif %}">
            <i class="fas fa-clipboard-list"></i> Job Order
        </a>
        <a href="{% url 'mechanic:view_req' %}" 
           class="{% if request.resolver_match.url_name == 'view_req' %}active{% endif %}">
            <i class="fas fa-tools"></i> Auto Parts
        </a>
        <a href="{% url 'mechanic:inventory' %}" 
           class="{% if request.resolver_match.url_name == 'inventory' %}active{% endif %}">
            <i class="fas fa-boxes"></i> Inventory
        </a>
        <a href="{% url 'mechanic:view_mat_odr' %}" 
           class="{% if request.resolver_match.url_name == 'view_mat_odr' %}active{% endif %}">
            <i class="fas fa-file-invoice"></i> Mat Order
        </a>
        <a href="{% url 'mechanic:ack_rec' %}" 
           class="{% if request.resolver_match.url_name == 'ack_rec' %}active{% endif %}">
            <i class="fas fa-file-alt"></i> Acknowledgement Receipt
        </a>
        <div class="logout">
            <a href="#" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>
    
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('logoutBtn').addEventListener('click', function(event) {
            const confirmLogout = confirm("Are you sure you want to log out?");
            if (!confirmLogout) {
                event.preventDefault();
            } else {
                window.location.href = "{% url 'mechanic:logout' %}";
            }
        });
    </script>
</body>
</html>
