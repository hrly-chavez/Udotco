{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'finance/materials.css' %}">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            color: rgb(17, 17, 17);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            border-right: 1px solid #d3d3d3;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            max-width: 150px;
            height: auto;
        }
        .sidebar a {
            color: rgb(17, 17, 17);
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: none;
        }
        .sidebar a:hover {
            background-color: #2d6fa0;
            color: white;
            transform: translateY(-10px);
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .sidebar a.active {
            color: white;
            background-color: #2d6fa0;
            transform: translateY(-10px);
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            border-left: 4px solid #171718;
        }
        .logout {
            margin-top: auto;
            text-align: center;
            width: 100%;
        }
        .logout a {
            width: 100%;
            margin: 0;
            border-radius: 0;
            text-align: center;
            display: block;
            box-sizing: border-box;
            background-color: red;
            color: white;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="{% static 'logo/logo.png' %}" alt="Logo">
        </div>
        <a href="{% url 'finance:mechanic_req' %}" 
           class="{% if request.resolver_match.url_name == 'mechanic_req' %}active{% endif %}">
            <i class="fas fa-tools"></i> Item Request
        </a>
        <a href="{% url 'finance:purchase_odr' %}" 
           class="{% if request.resolver_match.url_name == 'purchase_odr' %}active{% endif %}">
            <i class="fas fa-file-invoice-dollar"></i> Purchase Order
        </a>
        <a href="{% url 'finance:materials' %}" 
           class="{% if request.resolver_match.url_name == 'materials' %}active{% endif %}">
            <i class="fas fa-car"></i> Auto Parts
        </a>
        <a href="{% url 'finance:ack_rep' %}" 
           class="{% if request.resolver_match.url_name == 'ack_rep' %}active{% endif %}">
            <i class="fas fa-file-alt"></i> Acknowledgment Report
        </a>
        <div class="logout">
            <a href="{% url 'finance:logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>    

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
